<!-- Last Posts -->
<sections-title
  [setTitle]="'Posts'"
  [setSubtitle]="'Read my latest posts on my blog'"
  [setAlign]="'left'"
  [icon]="getLastPostsIcon"
  [color]="'var(--color-tertiary)'"
></sections-title>
<section class="flex flex-col gap-3 content-between w-full">
  @for(lastPost of getLastPosts; track lastPost.id){
  <sections-last-post [setLastPost]="lastPost"></sections-last-post>
  }
</section>
