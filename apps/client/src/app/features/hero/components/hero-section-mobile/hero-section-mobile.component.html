
<!-- Shows section only in portrait mode -->
@if(!getIsLandscape){
<section
  class="w-full top-1/5 md:top-2/12 absolute m-0 flex flex-col gap-4 justify-center items-center animation-load"
>
  <div
    class="flex flex-col md:flex-row justify-start items-center md:items-end gap-6 md:gap-3 z-40"
  >
    <div class="flex flex-col items-center md:items-start gap-1">
      <shared-imagotype></shared-imagotype>
      <p
        class="text-5xl md:text-6xl text-center md:text-left font-light tracking-tight"
      >
        <em>Houston</em>,<br />
        we have an <strong class="text-contrast">idea!</strong>
      </p>
    </div>
    <shared-scroll-navigator
      class="z-[999]"
      [setScrollTo]="'about-me'"
    ></shared-scroll-navigator>
  </div>
</section>
}
