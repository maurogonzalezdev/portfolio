<span
  class="hover:text-gray-300 text-2xl font-semibold"
  (click)="closeMenu()"
>
  @if(!link.fragment.startsWith('/')){
  <a [routerLink]="[]" [fragment]="link.fragment" (click)="navigate()">
    {{ link.name }}
  </a>
  }@else {
  <a [routerLink]="link.fragment">
    {{ link.name }}
  </a>
  }
</span>
