<span
  class="hover:text-gray-300 text-xl uppercase tracking-wide"
  (click)="closeMenu()"
>
  @if(!getLink.fragment.startsWith('/')){
  <a [routerLink]="[]" [fragment]="getLink.fragment" (click)="navigate()">
    {{ getLink.name }}
  </a>
  }@else {
  <a [routerLink]="getLink.fragment">
    {{ getLink.name }}
  </a>
  }
</span>
