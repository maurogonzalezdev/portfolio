<div class="flex flex-col lg:flex-row min-h-screen">
  <header
    class="relative w-full lg:w-6/12 h-screen lg:fixed lg:top-0 lg:left-0 lg:bottom-0 z-10 overflow-hidden"
    id="home"
  >
    @if(breakpoint === 'sm' || breakpoint === 'md'){
    <shared-mobile-navbar> </shared-mobile-navbar>
    } @else {
    <shared-desktop-navbar> </shared-desktop-navbar>
    }
    <hero-container class="w-full h-full"></hero-container>
  </header>
  <main class="w-full lg:w-6/12 lg:ml-auto">
    <section class="h-screen bg-amber-700" id="about-me"></section>
    <section class="h-screen bg-amber-600" id="projects"></section>
    <section class="h-screen bg-amber-500" id="skills"></section>
    <section class="h-screen bg-amber-400" id="contact"></section>
  </main>
</div>
