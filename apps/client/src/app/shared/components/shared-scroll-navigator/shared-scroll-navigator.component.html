<!-- Snap Scroll -->
<button
  class="mt-1 2k:mt-5 cursor-pointer items-center hover:scale-105 animate-bounce"
  (click)="navigate()"
  [attr.aria-label]="'Navigate to ' + getId"
>
  <div class="scroll-indicator" aria-hidden="true">
    <svg height="30" width="10">
      <circle class="scroll-indicator-dot" cx="5" cy="15" r="2" />
      <circle class="scroll-indicator-dot" cx="5" cy="15" r="2" />
    </svg>
  </div>
</button>
