<!-- Back to Top Component -->
<div
  class="animation-load back-to-top transition-all ease-in-out fixed bottom-8 right-8 mx-auto w-32 h-9 flex justify-center items-center rounded-sm text-white cursor-pointer bg-primary/70 hover:bg-contrast/40 text-sm font-light hover:font-black backdrop-blur-2xl hover:p-2"
  (click)="backToTop($event)"
>
  <ng-icon name="heroArrowUturnUp" [color]="'#ffffff'" [size]="'16'"></ng-icon>
  <span class="ml-2">Back to Top</span>
</div>
