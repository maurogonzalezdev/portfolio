<div class="relative">
  <img
    src="/images/hero-640w.webp"
    srcset="
      /images/hero-640w.webp   640w,
      /images/hero-768w.webp   768w,
      /images/hero-1024w.webp 1024w,
      /images/hero-1536w.webp 1536w
    "
    sizes="(max-width: 640px) 100vw,
           (max-width: 768px) 85vw,
           (max-width: 1024px) 52vw,
           48vw"
    alt="An astronaut floating in space."
    class="floating-astronaut relative -bottom-2.5 md:bottom-0 lg:bottom-2 landscape:-mb-0 md:landscape:-mb-0 lg:landscape:-mb-4"
    loading="eager"
    fetchpriority="high"
    (load)="imageLoaded()"
  />
</div>
