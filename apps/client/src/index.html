    <script>
      document.addEventListener('DOMContentLoaded', () => {
        loadTheme();
      });

      // Load theme from localStorage before Angular initializes
      function loadTheme() {
        const theme = localStorage.getItem('theme');

        if ((theme !== 'purple' && theme !== 'dark') || !theme) {
          document.documentElement.classList.remove('purple');
          localStorage.setItem('theme', 'dark');
        } else if (theme === 'purple') {
          const metaTag = document.querySelector('meta[name="theme-color"]');
          if (metaTag) {
            metaTag.setAttribute('content', '#17161f');
          }

          document.documentElement.classList.toggle('purple', true);
        } else {
          document.documentElement.classList.remove('purple');
        }
      }
    </script>
